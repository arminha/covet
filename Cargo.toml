[package]
name = "covet"
version = "2.0.2"
authors = ["Armin Häberling <armin.aha@gmail.com>"]
build = "build.rs"
edition = "2024"
rust-version = "1.85"

description = "CLI and web frontend for scanning with HP Envy printer / scanners"
repository = "https://github.com/arminha/covet"

readme = "README.md"
categories = ["command-line-utilities"]
license = "GPL-3.0-or-later"

include = [
    "Cargo.toml",
    "Cargo.lock",
    "src/**/*",
    "build.rs",
    "README.md",
    "LICENSE",
]

[badges]
maintenance = { status = "passively-maintained" }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
debug = true
split-debuginfo = "packed"

[build-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
serde = { version = "1.0.229", features = ["derive"] }

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
hyper = "1.11.0"
reqwest = { version = "0.12.28", features = ["stream"] }
thiserror = "2.0.20"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["fs", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
xmltree = "0.12.0"
xml = "1.4.0"
# cli
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
# web
axum = "0.8.9"
base64 = "0.23.1"
sha2 = "0.11.0"
headers = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.7.0", features = ["trace"] }
